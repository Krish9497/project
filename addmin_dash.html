<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard | AMS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Inter', sans-serif;
        background: #fdfdfd;
        color: #111;
    }

    .card {
        border: none;
        border-radius: 18px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.05);
    }

    .stat-card {
        transition: transform .2s ease;
    }

    .stat-card:hover {
        transform: translateY(-4px);
    }

    .stat-icon {
        font-size: 26px;
        opacity: .8;
    }

    .breadcrumb-wrap {
        font-size: 14px;
        color: #777;
    }

    .breadcrumb-wrap a {
        text-decoration: none;
        color: #0d6efd;
    }

    .soft-btn {
        border-radius: 14px;
        padding: 16px;
        font-weight: 600;
    }

    .empty-state {
        text-align: center;
        padding: 40px 0;
        color: #999;
    }

    .progress {
        height: 8px;
        border-radius: 10px;
        background: #eee;
    }

    .progress-bar {
        border-radius: 10px;
    }
</style>
</head>

<body>

<div class="container py-4">

    <!-- Breadcrumb -->
    <div class="breadcrumb-wrap mb-3">
        <a href="#">Home</a> / <span>Admin</span> / <span class="text-muted">Dashboard</span>
    </div>

    <!-- Header -->
    <div class="mb-4">
        <h2 class="fw-bold mb-1">Admin Dashboard</h2>
        <p class="text-muted">Overview & quick controls</p>
    </div>

    <!-- Stats -->
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="card stat-card p-3">
                <div class="d-flex justify-content-between">
                    <div>
                        <small class="text-muted">Total Users</small>
                        <h4 class="fw-bold mb-0">—</h4>
                    </div>
                    <i class="bi bi-people stat-icon text-primary"></i>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card stat-card p-3">
                <div class="d-flex justify-content-between">
                    <div>
                        <small class="text-muted">Students</small>
                        <h4 class="fw-bold mb-0">—</h4>
                    </div>
                    <i class="bi bi-person-badge stat-icon text-success"></i>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card stat-card p-3">
                <div class="d-flex justify-content-between">
                    <div>
                        <small class="text-muted">Faculty</small>
                        <h4 class="fw-bold mb-0">—</h4>
                    </div>
                    <i class="bi bi-person-workspace stat-icon text-info"></i>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card stat-card p-3">
                <div class="d-flex justify-content-between">
                    <div>
                        <small class="text-muted">Classes</small>
                        <h4 class="fw-bold mb-0">—</h4>
                    </div>
                    <i class="bi bi-building stat-icon text-warning"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Actions + Attendance -->
    <div class="row g-4 mb-4">

        <div class="col-md-8">
            <div class="card p-4">
                <h5 class="fw-semibold mb-3">Quick Actions</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <a href="#" class="btn btn-primary soft-btn w-100">
                            <i class="bi bi-person-plus"></i> Add User
                        </a>
                    </div>
                    <div class="col-md-6">
                        <a href="#" class="btn btn-light soft-btn w-100">
                            <i class="bi bi-people"></i> Manage Users
                        </a>
                    </div>
                    <div class="col-md-6">
                        <a href="#" class="btn btn-light soft-btn w-100">
                            <i class="bi bi-building"></i> Classes
                        </a>
                    </div>
                    <div class="col-md-6">
                        <a href="#" class="btn btn-light soft-btn w-100">
                            <i class="bi bi-book"></i> Subjects
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h6 class="text-muted mb-2">Today’s Attendance</h6>
                <h3 class="fw-bold mb-1">—</h3>
                <small class="text-muted">No data yet</small>
                <div class="progress mt-3">
                    <div class="progress-bar bg-success" style="width:0%"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Recent Users -->
    <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-semibold mb-0">Recent Users</h5>
            <a href="#" class="btn btn-sm btn-outline-primary">View All</a>
        </div>

        <!-- Empty State -->
        <div class="empty-state">
            <i class="bi bi-person-x fs-2 mb-2"></i>
            <p class="mb-0">No users added yet</p>
            <small>Add users to see activity here</small>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
